[project]
name = "maestro"
version = "0.1.0"
description = "Runs many full Claude Code sessions in tmux and lets one of them (or VS Code) direct the others."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    # 1.x API (FastMCP); 2.x renamed it to MCPServer and changed other calls.
    "mcp>=1.23.0,<2",
    "pyyaml>=6.0",
]

[project.scripts]
maestro-server = "maestro.server:main"
maestro-ops = "maestro.ops_mcp:main"
maestro-agent = "maestro.agent_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maestro"]
